<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarl Babad – Daniel Moquet</title>
<meta name="description" content="Gestion des contrats jardins et robots - Sarl Babad Daniel Moquet">
<meta name="theme-color" content="#34943f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babad DM">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',Arial,sans-serif;background:#f4f6f4;min-height:100vh;color:#222}
#hdr{background:#fff;border-bottom:3px solid #ef7d00;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 24px;min-height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:50px;width:auto}
.logo-t{color:#1a171b;font-size:15px;font-weight:800;line-height:1.2}
.logo-s{color:#34943f;font-size:10px}
nav{display:flex;gap:4px;flex-wrap:wrap}
.nb{background:transparent;border:none;color:#555;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;position:relative;white-space:nowrap}
.nb.on{background:#34943f;color:#fff}
.nb .dot{background:#e74c3c;color:#fff;border-radius:50%;font-size:9px;padding:1px 4px;position:absolute;top:2px;right:2px;font-weight:800}
.hbtn{background:#ef7d00;color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;white-space:nowrap}
#app{padding:24px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card-lg{background:#fff;border-radius:14px;padding:26px;box-shadow:0 3px 16px rgba(0,0,0,.08)}
.card-dark{background:#1a171b;border-radius:14px;padding:20px;color:#fff;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.sc{border-radius:12px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:4px solid}
.pills4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.pill{background:#fff;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;border:2px solid #eee}
.pill-l{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.pill-v{font-size:19px;font-weight:800}
.inp{padding:10px 12px;border:2px solid #d8f3dc;border-radius:8px;font-size:14px;background:#fafffe;color:#222;width:100%;font-family:inherit}
.inp:focus{border-color:#ef7d00;outline:none}
.fl{display:flex;flex-direction:column;gap:5px}
.fl>label{font-size:12px;font-weight:700;color:#34943f;text-transform:uppercase;letter-spacing:.04em}
.btn{padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;border:none;font-family:inherit}
.btn-p{background:#34943f;color:#fff}
.btn-s{background:#fff;border:2px solid #ccc;color:#555}
.btn-o{background:#ef7d00;color:#fff}
.btn-sm{background:#e8f5e9;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;font-family:inherit}
.btn-rd{background:#fde8e8;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;font-family:inherit}
.btn-bk{background:transparent;border:2px solid #34943f;color:#34943f;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;margin-bottom:16px}
.btn-add{background:#f0f7f0;border:2px dashed #95d5b2;border-radius:8px;padding:8px 14px;cursor:pointer;color:#34943f;font-weight:600;font-size:13px;font-family:inherit;margin-top:4px;margin-bottom:12px;display:block;width:100%;text-align:center}
.bdg{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.sbdg{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.rpill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.stag{display:inline-block;background:#d8f3dc;color:#34943f;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.rbar{display:flex;align-items:center;gap:8px}
.rtrack{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.rfill{height:100%;border-radius:5px;transition:width .4s}
.rval{font-size:13px;font-weight:800;min-width:40px;text-align:right}
.twrap{overflow-x:auto;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#1a171b;color:#fff;padding:12px 14px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td{padding:11px 14px;border-bottom:1px solid #f0f4f0;vertical-align:middle;font-size:14px}
.trow:hover{background:#f9fdf9;cursor:pointer}
.ibox{background:#f9fdf9;border-radius:10px;padding:12px 16px;border:1px solid #e8f5e9}
.ibox-l{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ibox-v{font-weight:600;color:#222;font-size:14px;word-break:break-word}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.svc-btn{padding:8px 10px;border-radius:8px;border:2px solid #e8f5e9;background:#f9fdf9;cursor:pointer;font-size:13px;font-family:inherit;text-align:left;transition:all .15s;color:#222}
.svc-btn.on{background:#34943f;border-color:#34943f;color:#fff;font-weight:700}
.emprow{background:#f9fdf9;border-radius:10px;border:1px solid #e8f5e9;padding:12px;margin-bottom:10px}
.empchip{background:#f0f7f0;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.icard{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #34943f;margin-bottom:10px}
.jmob{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:10px}
.lhdr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ptitle{font-size:24px;font-weight:800;color:#1a171b;margin-bottom:20px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #e8f5e9;flex-wrap:wrap}
.dacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.mrbox{border-radius:10px;padding:12px 14px;text-align:center}
.factions{display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:2px solid #f0f0f0;flex-wrap:wrap}
.empty{text-align:center;padding:50px 20px;color:#888}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:28px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:400px;width:100%}
.rl-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.mail-btn{background:#1a171b;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap}
.typ-btn{padding:7px 14px;border-radius:18px;border:2px solid #ddd;background:#fff;color:#333;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;transition:all .15s}
.typ-btn.on{background:#34943f;border-color:#34943f;color:#fff;font-weight:700}
.sal-btn{padding:7px 12px;border-radius:10px;border:2px solid #ddd;background:#fff;color:#333;cursor:pointer;font-size:12px;font-family:inherit;line-height:1.4;text-align:center;transition:all .15s}
.sal-btn.on{background:#34943f;border-color:#34943f;color:#fff;font-weight:700}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;color:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9999;display:none;max-width:300px}
@media(max-width:960px){.g4,.pills4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.mrgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){#hdr{padding:8px 12px}#app{padding:12px}.g4,.pills4,.svc-grid{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.gf{grid-template-columns:1fr}.ptitle{font-size:20px}.card-lg{padding:16px}.factions{flex-direction:column}.lhdr{flex-direction:column}}</style>
</head>

/* ══ UTILS ══ */
function esc(s){var d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML;}
function N(n){return Number(n||0).toLocaleString("fr-FR");}
function fmtD(d){if(!d)return"—";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function fmtH(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm>0?hh+"h"+(mm<10?"0":"")+mm:hh+"h";}
function daysUntil(ds){if(!ds)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds)-t)/86400000);}
function rpInfo(days){if(days===null)return null;if(days<0)return{t:"Expiré",c:"#c0392b",b:"#fde8e8"};if(days<=30)return{t:"J-"+days,c:"#b5651d",b:"#fef3e2"};if(days<=60)return{t:"J-"+days,c:"#34943f",b:"#d8f3dc"};return null;}
function mois(debut,fin){if(!debut||!fin)return 0;var d=new Date(debut),f=new Date(fin);return Math.max(0,(f.getFullYear()-d.getFullYear())*12+(f.getMonth()-d.getMonth()));}
function caC(c){return Number(c.montant||0);}
function coutIV(iv){return(iv.emps||[]).reduce(function(s,e){return s+Number(e.h||0)*Number(e.taux||0);},0);}
function coutAll(ivs){return(ivs||[]).reduce(function(s,i){return s+coutIV(i);},0);}
function totalH(ivs){return(ivs||[]).reduce(function(s,i){return s+(i.emps||[]).reduce(function(ss,e){return ss+Number(e.h||0);},0);},0);}
function mePct(ca,ivs){return ca>0?Math.round(((ca-coutAll(ivs))/ca)*100):0;}
function mob(){return window.innerWidth<640;}
function tab2(){return window.innerWidth<960;}
function fmtDate(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd;}

/* ══ HTML HELPERS ══ */
function bdg(st){var s=ST[st]||ST.actif;return'<span class="bdg" style="background:'+s.b+";color:"+s.c+'">'+s.l+"</span>";}
function sbdg(st){var s=SALCO[st]||{b:"#eee",c:"#555"};return'<span class="sbdg" style="background:'+s.b+";color:"+s.c+'">'+st+"</span>";}
function rpill(ds){var info=rpInfo(daysUntil(ds));if(!info)return"";return'<span class="rpill" style="background:'+info.b+";color:"+info.c+'">'+info.t+"</span>";}

/* ══ RELANCES ══ */
function getRelances(){
  return[].concat(
    S.jrd.filter(function(c){return c.statut==="actif";}).map(function(c){return{c:c,type:"jardin"};}),
    S.rbt.filter(function(c){return c.statut==="actif";}).map(function(c){return{c:c,type:"robot"};})
  ).filter(function(x){var d=daysUntil(x.c.fin);return d!==null&&d<=30;}).sort(function(a,b){return a.c.fin.localeCompare(b.c.fin);});
}

function doRecon(){

  if(rc.type==="jardin"){
    var old=S.jrd.filter(function(c){return c.id===rc.id;})[0];if(!old)return;
    var nD=new Date(old.fin);nD.setDate(nD.getDate()+1);
    var nF=new Date(old.fin);nF.setFullYear(nF.getFullYear()+1);
    S.jrd=S.jrd.map(function(c){return c.id===rc.id?Object.assign({},c,{statut:"expiré"}):c;});
    var nC=Object.assign({},old,{id:Date.now(),debut:fmtDate(nD),fin:fmtDate(nF),statut:"actif",iv:[],reconduit_de:old.id});
    S.jrd.push(nC);S.jActId=nC.id;S.jView="detail";S.tab="jardins";
  }else{
    var oldR=S.rbt.filter(function(c){return c.id===rc.id;})[0];if(!oldR)return;
    var nD2=new Date(oldR.fin);nD2.setDate(nD2.getDate()+1);
    var nF2=new Date(oldR.fin);nF2.setFullYear(nF2.getFullYear()+1);
    S.rbt=S.rbt.map(function(c){return c.id===rc.id?Object.assign({},c,{statut:"expiré"}):c;});
    var nR=Object.assign({},oldR,{id:Date.now(),debut:fmtDate(nD2),fin:fmtDate(nF2),statut:"actif",iv:[],prix_robot:0,prix_abri:0,prix_accessoires:0,reconduit_de:oldR.id});
    S.rbt.push(nR);S.rActId=nR.id;S.rView="detail";S.tab="robots";
  }
  S.reconConfirm=null;render();
}

  return'<div class="bc"><button class="btn-bk" onclick="S.rView=\'list\';render()" style="margin-bottom:0">← Robots</button><span style="color:#aaa">›</span><button class="btn-bk" onclick="S.rView=\'detail\';render()" style="margin-bottom:0">'+esc(c.client)+"</button><span style=\"color:#aaa\">›</span><span style=\"font-weight:700;font-size:13px\">Interventions</span></div>"+
    '<div class="card-dark"><div style="font-size:17px;font-weight:800;margin-bottom:4px">🤖 '+esc(c.client)+"</div><div style=\"color:#90c315;font-size:13px\">"+esc(c.modele)+" · "+fmtD(c.debut)+" → "+fmtD(c.fin)+" · Montant : "+N(c.montant)+" €"+"</div></div>"+
    '<div class="pills4">'+passPill((c.iv||[]).length,c.passages_prevus)+pillEl("⏱","Heures",fmtH(totalH(c.iv||[])),"#34943f")+pillEl("💸","Coût MO",N(coutAll(c.iv||[]))+" €","#b5651d")+pillEl("💶","Montant",N(c.montant)+" €","#34943f")+"</div>"+
    formH+listH;
}
